<html>
  <head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <h1>F1 calendar</h1>
      <span id="season-label" class="season-tag"></span>
    </header>

    <section id="next-session">
      <h2 id="next-session-title">Next F1 session <span id="countdown"></span></h2>
      

      <p><strong>Type :</strong> <span id="session-type">-</span></p>
      <p><strong>Circuit :</strong> <span id="circuit-name">-</span></p>
      <p><strong>Location :</strong> <span id="session-location">-</span></p>
      <p><strong>Date :</strong> <span id="session-date">-</span></p>
      <p><strong>Time :</strong> <span id="session-time">-</span></p>
      <p id="session-status"></p>
    </section>

    <section>
      <h2 id="list-title">Rest of this weekend</h2>
      <div id="weekend-sessions">
        
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
